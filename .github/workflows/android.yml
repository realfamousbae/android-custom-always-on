name: Android

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # создание GitHub Release по тегу
    env:
      # Версия: для тега v1.2.3 — «1.2.3», иначе — «dev.<номер запуска>».
      STANDBY_VERSION_NAME: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('dev.{0}', github.run_number) }}
      # Секреты нельзя проверять в `if` напрямую — только через переменную.
      HAS_SIGNING_KEY: ${{ secrets.STANDBY_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v6

      # С API 37 пакет платформы называется с минорной версией: android-37.0.
      - name: Android SDK platform 37
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0"

      # Ключ подписи из Secrets. В PR из форков секретов нет — release будет неподписанным.
      - name: Decode signing key
        if: env.HAS_SIGNING_KEY == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.STANDBY_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "STANDBY_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Test, lint, build
        env:
          STANDBY_KEYSTORE_PASSWORD: ${{ secrets.STANDBY_KEYSTORE_PASSWORD }}
          STANDBY_KEY_ALIAS: ${{ secrets.STANDBY_KEY_ALIAS }}
          STANDBY_KEY_PASSWORD: ${{ secrets.STANDBY_KEY_PASSWORD }}
        run: ./gradlew :core:test :app:lintDebug :app:assembleRelease

      - name: Collect APKs
        run: |
          mkdir -p dist
          name="standby-${STANDBY_VERSION_NAME#v}"
          release=$(find app/build/outputs/apk/release -name '*.apk' | head -1)
          cp "$release" "dist/$name.apk"
          ls -la dist

      - uses: actions/upload-artifact@v7
        with:
          name: standby-apk
          path: dist/*.apk

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') && env.HAS_SIGNING_KEY == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.apk --title "$GITHUB_REF_NAME" --generate-notes
